<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mariki Pub Quizz – Team</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      padding: 12px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    label {
      font-size: 13px;
      display: block;
      margin-top: 8px;
    }
    input, select, button {
      font-family: inherit;
      font-size: 14px;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      box-sizing: border-box;
      margin-top: 4px;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #0ea5e9;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .msg {
      margin-top: 8px;
      font-size: 13px;
    }
    .hint {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }
    .rounds-box {
      margin-top: 18px;
      padding-top: 8px;
      border-top: 1px solid #e5e7eb;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 6px;
    }
    th, td {
      padding: 4px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }
    th {
      font-weight: 600;
      font-size: 12px;
      color: #374151;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
      margin-right: 6px;
    }
    .status-open {
      background: #22c55e;
    }
    .status-closed {
      background: #ef4444;
    }
    .status-text {
      font-size: 12px;
    }
    .guess-yes {
      color: #16a34a;
      font-size: 12px;
    }
    .guess-no {
      color: #6b7280;
      font-size: 12px;
    }
    .map-picker {
      margin-top: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
      background: white;
    }
    .map-picker summary {
      padding: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .map-picker summary::-webkit-details-marker {
      display: none;
    }
    .map-picker summary::after {
      content: "Open";
      color: #0ea5e9;
      font-size: 12px;
      font-weight: 600;
    }
    .map-picker[open] summary::after {
      content: "Close";
    }
    #team-map {
      height: 320px;
      width: 100%;
      border-top: 1px solid #e5e7eb;
      background: #f3f4f6;
    }
    .map-picker-status {
      padding: 8px 10px 10px;
      border-top: 1px solid #e5e7eb;
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <h1>Mariki Pub Quizz – Team</h1>

  <label>
    Team name
    <input id="team-name" type="text" placeholder="Geoguesser Pro Team" />
  </label>

  <label>
    Round <span class="hint">(only “open” rounds accept guesses)</span>
    <select id="round-select"></select>
  </label>

  <label>
    Latitude
    <input id="lat" type="number" step="any" placeholder="e.g. -22.95190" />
  </label>

  <label>
    Longitude
    <input id="lng" type="number" step="any" placeholder="e.g. -043.21050" />
  </label>

  <details id="map-picker" class="map-picker">
    <summary>Pick on map</summary>
    <div id="team-map"></div>
    <div id="map-picker-status" class="map-picker-status">
      Tap the map to place your guess.
    </div>
  </details>

  <button id="submit">Send guess</button>

  <div id="msg" class="msg">
    Guess pending – fill in your team, round, and coordinates, then press “Send guess”.
  </div>

  <div class="rounds-box">
    <strong style="font-size:14px;">Rounds overview</strong>
    <div id="rounds-table"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);

    // Persistent deviceId for this browser
    let deviceId = localStorage.getItem('marikiDeviceId');
    if (!deviceId) {
      if (window.crypto && crypto.randomUUID) {
        deviceId = crypto.randomUUID();
      } else {
        deviceId = 'dev-' + Date.now() + '-' + Math.random().toString(16).slice(2);
      }
      localStorage.setItem('marikiDeviceId', deviceId);
    }

    let roundsCache = [];
    // myGuesses[roundId] = { roundId, roundName, teamName, lat, lng, ts }
    let myGuesses = {};
    let selectedRoundId = null;
    let leafletLoadPromise = null;
    let teamMap = null;
    let teamMarker = null;
    const DEFAULT_MAP_CENTER = [20, 0];
    const DEFAULT_MAP_ZOOM = 2;
    const PICKED_MAP_ZOOM = 10;

    function clearCoordinateInputs() {
      $('lat').value = '';
      $('lng').value = '';
      clearMapPin();
    }

    function validCoordinatePair() {
      const lat = parseFloat($('lat').value);
      const lng = parseFloat($('lng').value);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
      if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
      return { lat, lng };
    }

    function coordinateText(lat, lng) {
      return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }

    function setCoordinateInputs(lat, lng) {
      $('lat').value = lat.toFixed(5);
      $('lng').value = lng.toFixed(5);
    }

    function updateMapPickerStatus(text) {
      $('map-picker-status').textContent = text;
    }

    function clearMapPin() {
      if (teamMap && teamMarker) {
        teamMap.removeLayer(teamMarker);
      }
      teamMarker = null;
      updateMapPickerStatus('Tap the map to place your guess.');
    }

    function loadLeaflet() {
      if (window.L) return Promise.resolve();
      if (leafletLoadPromise) return leafletLoadPromise;

      leafletLoadPromise = new Promise((resolve, reject) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
        link.crossOrigin = '';
        document.head.appendChild(link);

        const script = document.createElement('script');
        script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
        script.crossOrigin = '';
        script.onload = () => resolve();
        script.onerror = () => reject(new Error('Could not load map assets'));
        document.head.appendChild(script);
      });

      return leafletLoadPromise;
    }

    async function ensureTeamMap() {
      try {
        updateMapPickerStatus('Loading map...');
        await loadLeaflet();

        if (!teamMap) {
          teamMap = L.map('team-map', { worldCopyJump: true })
            .setView(DEFAULT_MAP_CENTER, DEFAULT_MAP_ZOOM);

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(teamMap);

          teamMap.on('click', e => {
            setMapPin(e.latlng.lat, e.latlng.lng, {
              updateInputs: true,
              recenter: false,
            });
          });
        }

        setTimeout(() => teamMap.invalidateSize(), 0);

        const coords = validCoordinatePair();
        if (coords) {
          setMapPin(coords.lat, coords.lng, {
            updateInputs: false,
            recenter: true,
          });
        } else {
          updateMapPickerStatus('Tap the map to place your guess.');
        }
      } catch (err) {
        console.error(err);
        updateMapPickerStatus('Could not load the map. You can still enter coordinates manually.');
      }
    }

    function setMapPin(lat, lng, options = {}) {
      if (!teamMap || !Number.isFinite(lat) || !Number.isFinite(lng)) return;

      const roundedLat = Math.round(lat * 1e5) / 1e5;
      const roundedLng = Math.round(lng * 1e5) / 1e5;
      const point = [roundedLat, roundedLng];

      if (!teamMarker) {
        teamMarker = L.marker(point, { draggable: true }).addTo(teamMap);
        teamMarker.on('dragend', () => {
          const pos = teamMarker.getLatLng();
          setMapPin(pos.lat, pos.lng, {
            updateInputs: true,
            recenter: false,
          });
        });
      } else {
        teamMarker.setLatLng(point);
      }

      if (options.updateInputs) {
        setCoordinateInputs(roundedLat, roundedLng);
      }

      if (options.recenter) {
        teamMap.setView(point, Math.max(teamMap.getZoom(), PICKED_MAP_ZOOM));
      }

      updateMapPickerStatus('Selected: ' + coordinateText(roundedLat, roundedLng));
    }

    function syncMapFromInputs() {
      if (!teamMap) return;
      const latRaw = $('lat').value.trim();
      const lngRaw = $('lng').value.trim();
      if (!latRaw && !lngRaw) {
        clearMapPin();
        return;
      }

      const coords = validCoordinatePair();
      if (!coords) {
        updateMapPickerStatus('Enter valid latitude and longitude to move the pin.');
        return;
      }

      setMapPin(coords.lat, coords.lng, {
        updateInputs: false,
        recenter: true,
      });
    }

    function rememberSelectedRound(clearOnChange = false) {
      const sel = $('round-select');
      const roundId = sel.value;
      if (!roundId) {
        selectedRoundId = null;
        return;
      }

      if (clearOnChange && selectedRoundId && selectedRoundId !== roundId) {
        clearCoordinateInputs();
        $('msg').textContent = 'Round changed - enter coordinates for the selected round.';
      }

      selectedRoundId = roundId;
    }

    function renderRoundsTable() {
      const box = $('rounds-table');

      if (!roundsCache.length) {
        box.innerHTML = '<div style="font-size:12px;color:#6b7280;">No rounds available yet.</div>';
        return;
      }

      let html = '<table><thead><tr><th>Round</th><th>Status</th><th>Your guess</th></tr></thead><tbody>';
      roundsCache.forEach(r => {
        const isOpen = r.isOpen;
        const dotClass = isOpen ? 'status-open' : 'status-closed';
        const statusText = isOpen ? 'Open' : 'Closed';

        const my = myGuesses[r.id];
        let guessCell;
        if (my) {
          guessCell = `<span class="guess-yes">✅ Sent as <strong>${my.teamName}</strong> (${(+my.lat).toFixed(5)}, ${(+my.lng).toFixed(5)})</span>`;
        } else {
          guessCell = `<span class="guess-no">–</span>`;
        }

        html += `<tr>
          <td>${r.name}</td>
          <td><span class="status-dot ${dotClass}"></span><span class="status-text">${statusText}</span></td>
          <td>${guessCell}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      box.innerHTML = html;
    }

    async function loadRounds(preserveSelection = true) {
      try {
        const res = await fetch('/api/rounds');
        if (!res.ok) throw new Error('Failed to load rounds');
        const rounds = await res.json();
        roundsCache = rounds;

        const sel = $('round-select');
        const previousId = preserveSelection ? sel.value : null;

        sel.innerHTML = '';

        if (rounds.length === 0) {
          const opt = document.createElement('option');
          opt.textContent = 'No rounds available';
          opt.disabled = true;
          sel.appendChild(opt);
          selectedRoundId = null;
          renderRoundsTable();
          return;
        }

        rounds.forEach(r => {
          const opt = document.createElement('option');
          opt.value = r.id;
          opt.textContent = r.name + (r.isOpen ? ' (open)' : ' (closed)');
          opt.dataset.open = r.isOpen ? 'true' : 'false';
          sel.appendChild(opt);
        });

        if (previousId && rounds.some(r => r.id === previousId)) {
          sel.value = previousId;
        } else {
          sel.value = rounds[0].id;
        }

        rememberSelectedRound(preserveSelection);
        renderRoundsTable();
      } catch (err) {
        console.error(err);
        $('msg').textContent = 'Could not load rounds. Please try again later.';
      }
    }

    async function loadMyGuesses() {
      try {
        const res = await fetch('/api/my-guesses?deviceId=' + encodeURIComponent(deviceId));
        if (!res.ok) throw new Error('Failed to load guesses');
        const arr = await res.json();
        myGuesses = {};
        arr.forEach(g => {
          myGuesses[g.roundId] = g;
        });
        renderRoundsTable();
      } catch (err) {
        console.error(err);
      }
    }

    $('round-select').addEventListener('change', () => {
      rememberSelectedRound(true);
    });

    $('map-picker').addEventListener('toggle', () => {
      if ($('map-picker').open) {
        ensureTeamMap();
      }
    });

    $('lat').addEventListener('input', syncMapFromInputs);
    $('lng').addEventListener('input', syncMapFromInputs);

    $('submit').addEventListener('click', async () => {
      const teamName = $('team-name').value.trim();
      const sel = $('round-select');
      const opt = sel.selectedOptions[0];

      if (!opt) {
        $('msg').textContent = 'No round selected.';
        return;
      }

      const roundId = opt.value;
      const isOpen = opt.dataset.open === 'true';

      let lat = parseFloat($('lat').value);
      let lng = parseFloat($('lng').value);

      if (!teamName) {
        $('msg').textContent = 'Please enter a team name.';
        return;
      }
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
        $('msg').textContent = 'Please enter numeric coordinates.';
        return;
      }
      if (!isOpen) {
        $('msg').textContent = 'This round is currently closed. Please choose an open round.';
        return;
      }

      // Round to 5 decimals before submitting
      lat = Math.round(lat * 1e5) / 1e5;
      lng = Math.round(lng * 1e5) / 1e5;

      $('submit').disabled = true;
      $('msg').textContent = 'Sending guess…';

      try {
        const res = await fetch('/api/guess', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ roundId, teamName, lat, lng, deviceId })
        });
        const data = await res.json();
        if (!res.ok) {
          $('msg').textContent = data.error || 'Server error. Try again.';
        } else {
          $('msg').textContent = `Guess sent ✅ as "${teamName}" (${lat.toFixed(5)}, ${lng.toFixed(5)})`;
          await loadMyGuesses(); // update table confirmation
        }
      } catch (err) {
        console.error(err);
        $('msg').textContent = 'Failed to send guess. Check your connection and try again.';
      } finally {
        $('submit').disabled = false;
      }
    });

    // Initial load & periodic updates
    (async function init() {
      await loadRounds(false);
      await loadMyGuesses();
    })();

    setInterval(() => {
      loadRounds(true);
      loadMyGuesses();
    }, 5000);
  </script>
</body>
</html>
