<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mariki Pub Quizz – Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      display: grid;
      grid-template-columns: 350px 1fr;
      height: 100vh;
    }
    aside {
      padding: 12px;
      border-right: 1px solid #e5e7eb;
      box-sizing: border-box;
      overflow-y: auto;
    }
    #map { height: 100vh; width: 100%; }

    .label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
      display: block;
    }
    input, select, button { font-family: inherit; }

    input[type="number"] { width: 49%; padding: 6px; margin-bottom: 4px; }
    select { width: 100%; padding: 6px; margin-bottom: 8px; }

    button {
      padding: 8px 10px;
      margin-top: 4px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-primary { background: #0ea5e9; color: white; }
    .btn-secondary { background: #e5e7eb; }
    .btn-danger { background: #fee2e2; color: #b91c1c; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 8px;
    }
    th, td {
      padding: 4px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
      margin-right: 4px;
    }
    .badge-open {
      padding: 2px 6px;
      border-radius: 999px;
      background: #22c55e22;
      color: #15803d;
      font-size: 11px;
      margin-left: 4px;
    }
    .badge-closed {
      padding: 2px 6px;
      border-radius: 999px;
      background: #fecaca;
      color: #b91c1c;
      font-size: 11px;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <aside>
    <h2>Admin</h2>

    <label class="label">New round name</label>
    <input id="new-round-name" type="text" placeholder="e.g. Landmark Round" />
    <button class="btn-secondary" id="add-round">Add round</button>

    <hr>

    <label class="label">Select Round</label>
    <select id="round-select"></select>
    <div id="round-status" style="font-size:12px;color:#6b7280;margin-bottom:6px;"></div>

    <button class="btn-secondary" id="toggle-open">Toggle open/closed</button>

    <hr>

    <label class="label">Set Target</label>
    <div>
      <input id="target-lat" type="number" step="any" placeholder="Latitude">
      <input id="target-lng" type="number" step="any" placeholder="Longitude">
    </div>
    <button class="btn-primary" id="set-target">Set target</button>
    <div id="target-info" style="font-size:12px;color:#6b7280;margin-top:6px;">No target set.</div>

    <h3>Guesses</h3>
    <div id="results"></div>

    <h3>Leaderboard (Total Points)</h3>
    <div id="leaderboard"></div>

    <hr>
    <button class="btn-danger" id="reset-game" style="margin-top:8px;">
      Reset game (clear all rounds & guesses)
    </button>
    <div style="font-size:11px;color:#6b7280;margin-top:4px;">
      This will delete all rounds, guesses, and scores and create a fresh “Test Round”.
    </div>

  </aside>

  <div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const $ = id => document.getElementById(id);

// --------------------
// MAP INITIAL SETUP
// --------------------
const map = L.map('map', { worldCopyJump: true }).setView([20, 0], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// Detect user manual zoom/pan → stop autoreset
let userAdjustedView = false;
map.on('zoomend moveend', () => userAdjustedView = true);

let markerTarget = null;
let mapLayers = []; // markers + lines
let roundsCache = [];
let currentRoundId = null;

// --------------------
// COLOR ASSIGNMENT
// --------------------
const colors = ['#ef4444','#3b82f6','#22c55e','#f59e0b','#a855f7','#06b6d4','#e11d48','#14b8a6','#f97316','#84cc16'];
const teamColors = new Map();
function colorForTeam(name) {
  if (!teamColors.has(name)) {
    const idx = teamColors.size % colors.length;
    teamColors.set(name, colors[idx]);
  }
  return teamColors.get(name);
}

function fmt(lat, lng) {
  return `${(+lat).toFixed(5)}, ${(+lng).toFixed(5)}`;
}

function hav(lat1, lon1, lat2, lon2) {
  const R = 6371.0088;
  const toRad = v => v * Math.PI/180;
  const dLat = toRad(lat2-lat1);
  const dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 +
            Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*
            Math.sin(dLon/2)**2;
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// --------------------
// GEOGUESSR-STYLE SCORING
// --------------------
const MAX_BASE_POINTS = 5000;
const EXACT_BONUS_POINTS = 1000;
const EXACT_BONUS_DISTANCE_KM = 0.05; // 50 m
const WORLD_DIAGONAL_KM = 20015.0868;

function isScoredRound(round) {
  return round && !/tie\s*break|tiebreak/i.test(round.name);
}

function scoredTargetRounds() {
  return roundsCache.filter(r => isScoredRound(r) && r.target);
}

function mapDiagonalKm() {
  const targetRounds = scoredTargetRounds();
  if (targetRounds.length < 2) return WORLD_DIAGONAL_KM;

  const lats = targetRounds.map(r => r.target.lat);
  const lngs = targetRounds.map(r => r.target.lng);
  const minLat = Math.min(...lats);
  const maxLat = Math.max(...lats);
  const minLng = Math.min(...lngs);
  const maxLng = Math.max(...lngs);
  const diagonal = hav(minLat, minLng, maxLat, maxLng);

  return Number.isFinite(diagonal) && diagonal > 0 ? diagonal : WORLD_DIAGONAL_KM;
}

function scoreForDistance(distanceKm, diagonalKm) {
  if (!Number.isFinite(distanceKm)) return null;
  const safeDiagonal = Number.isFinite(diagonalKm) && diagonalKm > 0
    ? diagonalKm
    : WORLD_DIAGONAL_KM;
  const base = Math.round(MAX_BASE_POINTS * Math.exp(-10 * distanceKm / safeDiagonal));
  const bonus = distanceKm <= EXACT_BONUS_DISTANCE_KM ? EXACT_BONUS_POINTS : 0;
  return Math.max(0, Math.min(MAX_BASE_POINTS, base)) + bonus;
}

function fmtDistance(distanceKm) {
  if (!Number.isFinite(distanceKm)) return "–";
  if (distanceKm < 1) return Math.round(distanceKm * 1000) + " m";
  return distanceKm.toFixed(1) + " km";
}

function fmtPoints(points) {
  return Number.isFinite(points) ? points.toLocaleString() : "–";
}

// --------------------
// LOAD ROUNDS
// --------------------
async function loadRounds() {
  const res = await fetch('/api/rounds');
  roundsCache = await res.json();

  const sel = $('round-select');
  sel.innerHTML = '';

  if (!roundsCache.length) {
    $('round-status').textContent = 'No rounds available.';
    $('target-info').textContent = 'No target set.';
    $('results').innerHTML = '<div style="color:#6b7280;font-size:12px;">No guesses yet.</div>';
    $('leaderboard').innerHTML = '<div style="color:#6b7280;font-size:12px;">No scores yet.</div>';
    clearTarget();
    clearMapLayers();
    return;
  }

  roundsCache.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.id;
    opt.textContent = r.name + (r.isOpen ? " (open)" : " (closed)");
    sel.appendChild(opt);
  });

  if (!currentRoundId || !roundsCache.some(r => r.id === currentRoundId)) {
    currentRoundId = roundsCache[0].id;
  }

  sel.value = currentRoundId;
  updateRoundStatus();
  updateTargetUI();
  refreshGuesses();
  updateLeaderboard();
}

// --------------------
// ROUND STATUS
// --------------------
function updateRoundStatus() {
  const r = roundsCache.find(x => x.id === currentRoundId);
  if (!r) {
    $('round-status').textContent = 'No round selected.';
    return;
  }

  $('round-status').innerHTML =
    `<strong>${r.name}</strong> ` +
    (r.isOpen ? `<span class="badge-open">OPEN</span>`
              : `<span class="badge-closed">CLOSED</span>`);
}

// --------------------
// TARGET UI
// --------------------
function clearTarget() {
  if (markerTarget) {
    map.removeLayer(markerTarget);
    markerTarget = null;
  }
}

function updateTargetUI() {
  const r = roundsCache.find(x => x.id === currentRoundId);
  clearTarget();

  if (!r || !r.target) {
    $('target-info').textContent = "No target set.";
    $('target-lat').value = "";
    $('target-lng').value = "";
    return;
  }

  const { lat, lng } = r.target;

  $('target-info').textContent = "Target: " + fmt(lat, lng);
  $('target-lat').value = lat;
  $('target-lng').value = lng;

  markerTarget = L.marker([lat, lng]).addTo(map);
  markerTarget.bindTooltip("TARGET<br>" + fmt(lat, lng), {
    permanent: true, offset:[0,-10]
  });

  if (!userAdjustedView) {
    map.setView([lat, lng], 10);
  }
}

// --------------------
// EVENT: CHANGE ROUND
// --------------------
$('round-select').addEventListener('change', e => {
  currentRoundId = e.target.value;
  userAdjustedView = false; // allow autosnap once
  updateRoundStatus();
  updateTargetUI();
  refreshGuesses();
});

// --------------------
// ADD ROUND
// --------------------
$('add-round').addEventListener('click', async () => {
  const name = $('new-round-name').value.trim();
  await fetch('/api/round', {
    method:"POST",
    headers: { "Content-Type":"application/json" },
    body: JSON.stringify({ name })
  });
  $('new-round-name').value = "";
  await loadRounds();
});

// --------------------
// TOGGLE OPEN/CLOSED
// --------------------
$('toggle-open').addEventListener('click', async () => {
  const r = roundsCache.find(x => x.id === currentRoundId);
  if (!r) return;
  const newState = !r.isOpen;

  await fetch('/api/round-status', {
    method:"POST",
    headers: { "Content-Type":"application/json" },
    body: JSON.stringify({ id: currentRoundId, isOpen:newState })
  });

  await loadRounds();
});

// --------------------
// SET TARGET
// --------------------
$('set-target').addEventListener('click', async () => {
  const lat = parseFloat($('target-lat').value);
  const lng = parseFloat($('target-lng').value);
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
    alert("Enter numeric values");
    return;
  }
  await fetch('/api/round-target', {
    method:"POST",
    headers: { "Content-Type":"application/json" },
    body: JSON.stringify({ id: currentRoundId, lat, lng })
  });

  await loadRounds();
});

// --------------------
// MAP LAYERS
// --------------------
function clearMapLayers() {
  mapLayers.forEach(layer => map.removeLayer(layer));
  mapLayers = [];
}

// --------------------
// DELETE GUESS (ADMIN)
// --------------------
async function deleteGuess(encodedTeam) {
  const team = decodeURIComponent(encodedTeam);
  if (!currentRoundId) return;
  const ok = confirm(`Delete guess for "${team}" in this round?`);
  if (!ok) return;

  await fetch('/api/delete-guess', {
    method: 'POST',
    headers: { 'Content-Type':'application/json' },
    body: JSON.stringify({ roundId: currentRoundId, teamName: team })
  });

  await refreshGuesses();
  await updateLeaderboard();
}

// --------------------
// REFRESH GUESSES
// --------------------
async function refreshGuesses() {
  if (!currentRoundId) return;

  const res = await fetch('/api/guesses?roundId='+currentRoundId);
  const data = await res.json();

  clearMapLayers();

  const round = roundsCache.find(r => r.id === currentRoundId);
  const tgt = round && round.target ? round.target : null;
  const diagonalKm = mapDiagonalKm();
  const roundCountsForScore = isScoredRound(round);

  const rows = [];
  const points = [];

  if (tgt) {
    points.push([tgt.lat, tgt.lng]);
  }

  for (const [team, g] of Object.entries(data)) {
    const color = colorForTeam(team);

    // Team marker
    const m = L.circleMarker([g.lat, g.lng], {
      radius: 8,
      color,
      fillColor:color,
      fillOpacity:.9
    }).addTo(map);
    m.bindTooltip(`${team}<br>${fmt(g.lat, g.lng)}`);
    mapLayers.push(m);
    points.push([g.lat, g.lng]);

    // Colored line from guess to target
    if (tgt) {
      const line = L.polyline([[g.lat, g.lng],[tgt.lat, tgt.lng]], {
        color,
        weight: 2,
        opacity: 0.8
      }).addTo(map);
      mapLayers.push(line);
    }

    const dist = tgt ? hav(g.lat, g.lng, tgt.lat, tgt.lng) : null;
    const score = tgt && roundCountsForScore ? scoreForDistance(dist, diagonalKm) : null;
    rows.push({ team, lat:g.lat, lng:g.lng, dist, score });
  }

  if (points.length && !userAdjustedView) {
    const b = L.latLngBounds(points).pad(0.2);
    map.fitBounds(b, { maxZoom: 16 });
  }

  rows.sort((a,b) => {
    if (a.score != null && b.score != null) {
      return b.score - a.score || a.dist - b.dist || a.team.localeCompare(b.team);
    }
    if (a.score != null) return -1;
    if (b.score != null) return 1;
    if (a.dist == null && b.dist == null) return a.team.localeCompare(b.team);
    if (a.dist == null) return 1;
    if (b.dist == null) return -1;
    return a.dist - b.dist;
  });

  let html =
    `<table><thead><tr>
      <th>#</th><th>Team</th><th>Guess</th><th>Distance</th><th>Points</th><th>Actions</th>
    </tr></thead><tbody>`;

  rows.forEach((r,i) => {
    const c = colorForTeam(r.team);
    const encodedTeam = encodeURIComponent(r.team);
    html += `
      <tr>
        <td>${i+1}</td>
        <td><span class="dot" style="background:${c}"></span>${r.team}</td>
        <td>${fmt(r.lat, r.lng)}</td>
        <td>${fmtDistance(r.dist)}</td>
        <td>${fmtPoints(r.score)}</td>
        <td>
          <button
            style="background:#fee2e2;color:#b91c1c;font-size:11px;padding:4px 6px;"
            onclick="deleteGuess('${encodedTeam}')"
          >Delete</button>
        </td>
      </tr>
    `;
  });
  html += `</tbody></table>`;

  $('results').innerHTML = rows.length ? html :
    `<div style="color:#6b7280;font-size:12px;">No guesses yet.</div>`;
}

// --------------------
// LEADERBOARD
// --------------------
async function updateLeaderboard() {
  const totals = new Map();
  const diagonalKm = mapDiagonalKm();

  for (const r of roundsCache) {
    if (!r.target || !isScoredRound(r)) continue;

    const res = await fetch('/api/guesses?roundId='+r.id);
    const data = await res.json();

    for (const [team, g] of Object.entries(data)) {
      const d = hav(g.lat, g.lng, r.target.lat, r.target.lng);
      const pts = scoreForDistance(d, diagonalKm);
      totals.set(team, (totals.get(team)||0) + pts);
    }
  }

  const sorted = Array.from(totals.entries())
    .map(([team, pts]) => ({ team, pts }))
    .sort((a,b) => b.pts - a.pts || a.team.localeCompare(b.team));

  let html =
    `<table><thead><tr>
      <th>#</th><th>Team</th><th>Points</th>
    </tr></thead><tbody>`;

  sorted.forEach((t,i) => {
    const c = colorForTeam(t.team);
    html += `
      <tr>
        <td>${i+1}</td>
        <td><span class="dot" style="background:${c}"></span>${t.team}</td>
        <td>${t.pts}</td>
      </tr>
    `;
  });

  html += `</tbody></table>`;

  const scale = `<div style="font-size:11px;color:#6b7280;margin-top:4px;">
    Scoring: ${MAX_BASE_POINTS} * exp(-10 * distance / ${diagonalKm.toFixed(1)} km), +${EXACT_BONUS_POINTS} within 50 m. Tiebreak excluded from totals.
  </div>`;

  $('leaderboard').innerHTML = sorted.length ? scale + html :
    `<div style="font-size:12px;color:#6b7280;">No scores yet.</div>`;
}

// --------------------
// RESET GAME BUTTON
// --------------------
$('reset-game').addEventListener('click', async () => {
  const ok = confirm(
    'This will clear ALL rounds, guesses, targets, and scores and create a fresh "Test Round".\n\nAre you sure?'
  );
  if (!ok) return;

  await fetch('/api/reset', { method: 'POST' });
  userAdjustedView = false;
  await loadRounds();
});

// --------------------
// AUTO REFRESH
// --------------------
setInterval(refreshGuesses, 2000);
setInterval(updateLeaderboard, 5000);

// --------------------
// INIT
// --------------------
loadRounds();

</script>
</body>
</html>
